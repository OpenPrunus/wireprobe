name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 build pytest

      - name: Lint (fail on syntax errors / undefined names)
        run: flake8 wireprobe --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint (style, non-blocking)
        run: flake8 wireprobe --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit and functional tests
        run: pytest -v

      - name: Build package
        run: python -m build

      - name: Build .deb package (validation)
        if: matrix.python-version == '3.12'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          ./packaging/deb/build.sh "0.0.0+ci.${{ github.run_number }}" dist-deb

      - name: Upload .deb artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: wireprobe-deb
          path: dist-deb/*.deb
